[package]
name = "arbeitsblatt"
version = "0.5.0"
entrypoint = "src/lib.typ"
compiler = "0.15.0"
authors = ["Lukas Köhl", "Alexander Schulz"]
description = "Vorlage für Arbeitsblätter im Schulunterricht: Aufgaben mit Lösungen und Material, Themes, Kästen, Lücken und mehrere Fassungen (Druck, Bildschirm, Lösung) aus einer Quelle."
license = "MIT"
repository = "https://github.com/Loewe1000/Typst-Schule"
exclude = ["docs", "showcase", "scripts"]
keywords = [
    "ab",
    "arbeitsblatt",
    "lehrer",
]
categories = ["office", "layout", "components"]
disciplines = ["education", "mathematics", "physics", "computer-science"]

[template]
path = "template"
entrypoint = "ab.typ"
thumbnail = "thumbnail.png"
