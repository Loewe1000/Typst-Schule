[package]
name = "klausurboegen"
version = "0.5.0"
entrypoint = "src/lib.typ"
compiler = "0.15.0"
authors = ["Lukas Köhl", "Alexander Schulz"]
description = "Klausurbögen im A3-Querformat zum Falten: kariertes oder liniertes Schreibfeld mit Korrekturrand, Kopf mit Namenszeile und ein Ergebnisdruck, der Punktetabelle, Note und Notenschlüssel aus einer CSV-Datei auf die beschriebenen Bögen setzt."
license = "MIT"
repository = "https://github.com/Loewe1000/Typst-Schule"
exclude = ["docs"]
keywords = ["schule", "klausur", "klassenarbeit", "klausurbogen"]
categories = ["components", "layout"]
disciplines = ["education"]
