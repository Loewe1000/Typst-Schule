[package]
name = "typstage-geogebra"
version = "0.1.0"
compiler = "0.15.0"
entrypoint = "src/lib.typ"
authors = ["Alexander Schulz"]
license = "MIT"
repository = "https://github.com/Loewe1000/Typst-Schule"
description = "GeoGebra-Applets für typstage: die Konstruktion baut GeoGebra, die Dramaturgie kommt aus den Folien. Ein eigenes Paket, damit eine Präsentation ohne Applets nichts davon mitlädt."
keywords = ["presentation", "geogebra", "typstage"]
categories = ["presentation"]
disciplines = ["education", "mathematics"]

# Nicht mitausliefern: die Beispieldatei ist zum Ausprobieren da,
# nicht Teil des Pakets — und sie zieht CeTZ als Abhängigkeit nach.
exclude = ["example.typ"]
