name: Build & Deploy Dokumentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Typst HTML-Docs bauen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ohne das bleiben die Submodule leere Ordner, das Bau-Skript findet
          # dort kein docs/docs.typ und die Seiten von typstage,
          # typstage-geogebra und blockst verschwinden wortlos von der Website.
          submodules: recursive

      - name: Typst installieren
        uses: typst-community/setup-typst@v4
        with:
          # Festgenagelt, nicht `latest`: der Bündel-Export, aus dem Website und
          # Handbuch in einem Lauf entstehen, steht hinter `--features bundle`
          # und ist ausdrücklich experimentell. Mit `latest` könnte eine neue
          # Typst-Fassung die veröffentlichte Doku brechen, ohne dass sich hier
          # etwas geändert hat. Beim Anheben örtlich einmal
          # `bash .github/scripts/build.sh` laufen lassen.
          typst-version: "0.15.0"

      - name: Node.js installieren (für Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dokumentation bauen
        run: bash .github/scripts/build.sh

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: .docs-site/
          if-no-files-found: error
          include-hidden-files: true

      - name: GitHub Pages konfigurieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages-Artefakt hochladen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .docs-site/

  deploy:
    name: Auf GitHub Pages deployen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy auf GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
